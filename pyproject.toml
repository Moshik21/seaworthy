[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "seaworthy-release"
dynamic = ["version"]
description = "A release-readiness check engine for hosted release pipelines. Standard library only."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Moshik21" }]
keywords = ["release", "preflight", "release-readiness", "ci", "notarization"]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/Moshik21/seaworthy"
Source = "https://github.com/Moshik21/seaworthy"
Issues = "https://github.com/Moshik21/seaworthy/issues"
Changelog = "https://github.com/Moshik21/seaworthy/blob/main/CHANGELOG.md"

[project.scripts]
seaworthy = "seaworthy.cli:main"

[tool.setuptools.dynamic]
version = { attr = "seaworthy.VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seaworthy = ["demo_data/profile.json", "demo_data/fixtures/*.json"]
