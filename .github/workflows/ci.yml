# Manual only: the hosted-minutes budget is for releases, so nothing triggers this on push or pull request.
# Run it from the Actions tab, or with `gh workflow run ci.yml --ref main`; each dispatch is five hosted jobs.
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        python: ["3.8", "3.13"]
        exclude:
          - os: macos-15            # no Python 3.8 build for Apple Silicon runners
            python: "3.8"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/smoke
      - run: python bin/seaworthy demo
      - run: python scripts/self-audit
        # the name denylist is private; the audit here covers secrets, e-mails, paths and addresses only
